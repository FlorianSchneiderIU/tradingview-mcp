services:
  mm-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: mm-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      # ── API credentials ─────────────────────────────────────────────────────

      # ── Trading mode ────────────────────────────────────────────────────────
      # true  → Bybit Demo Trading (api-demo.bybit.com, simulated funds)
      # false → Live trading (api.bybit.com, real funds!)

      # ── Risk / position sizing ───────────────────────────────────────────────
      # Target account loss at the initial stop-loss as a fraction of equity (0.01 = 1%)

      # Maximum number of simultaneously open positions across all coins

      # Leverage caps are fetched per symbol; order leverage is set dynamically
      # before entry so Bybit risk-tier position caps are not squeezed by max leverage.

      # Daily drawdown limit: block new entries once net equity loss for the UTC day
      # exceeds this fraction of the day-start equity. Tracked positions are flattened
      # by default and entries resume at the next UTC day.
      # Optional weekly account drawdown limit. 0 disables it.

      # Correlation cluster guard: max simultaneous positions from the 18-coin correlated
      # cluster (every coin except TRXUSDT, which is the portfolio's only independent coin).
      # Research (16 months, 19 coins) found 149/171 pairs at return corr >= 0.60 — all 18
      # form one cluster. Default 3 keeps two slots free while total stays at 5.

      # ── Internal paths (no need to change when using volumes below) ──────────
      CONFIGS_PATH: /app/configs/top20_configs.json
      MODELS_DIR: /app/models
      RISK_STATE_PATH: /app/logs/risk_state.json
      ACTIVE_TRADES_STATE_PATH: /app/logs/active_trades.json
      TRADE_LEDGER_PATH: /app/logs/trade_ledger.jsonl
      HEARTBEAT_STATE_PATH: /app/logs/heartbeat_state.json
      RL_EXECUTION_URL: http://rl-exec-bot:8090/v1/signals
      RL_EXECUTION_TIMEOUT_SECONDS: "1.0"
      TURTLE_MODELS_DIR: /app/turtle_models
      TURTLE_LEADERBOARD_PATH: /app/turtle_leaderboard.csv
      SESSION_ORB_MODELS_DIR: /app/session_orb_models
      ENABLE_GGSHOT_227: "true"
      GGSHOT_227_SYMBOLS: BTCUSDT,BNBUSDT
      GGSHOT_227_CONFIG_PATH: /app/configs/ggshot_227_configs.json
      GGSHOT_227_WARMUP_BARS: "20000"
      LOG_DIR: /app/logs
    depends_on:
      - rl-exec-bot

    volumes:
      # Coin configs (read-only) — edit top20_configs.json to adjust the coin list
      - ./bot/configs:/app/configs:ro
      # Pre-trained DT models (read-only) — generated by mm-train or train_dt.py
      - ./bot/models:/app/models:ro
      - ./scripts/bybit_top50_turtle_per_symbol_turnover_sfp_tex_v4_models:/app/turtle_models:ro
      - ./scripts/bybit_top50_turtle_per_symbol_turnover_sfp_tex_v4_leaderboard.csv:/app/turtle_leaderboard.csv:ro
      - ./scripts/session_orb_top50_judas_fvg_risk2_v1_models:/app/session_orb_models:ro
      # Persisted logs ─ survives container restarts
      - ./bot/logs:/app/logs

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Standalone fill notification service ─────────────────────────────────────
  # Dedicated container that connects to the private Bybit WS and sends
  # Telegram TP/SL fill messages.  Reads active_trades.json (written by
  # mm-bot) from the shared logs volume to enrich messages with strategy/
  # direction context.  Set FILL_NOTIFY_EXTERNAL=true in .env so the main
  # bot keeps its private WS for position management but skips duplicate
  # Telegram sends.
  fill-notifier:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python fill_notifier.py
    container_name: fill-notifier
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      ACTIVE_TRADES_STATE_PATH: /app/logs/active_trades.json
      LOG_DIR: /app/logs
    volumes:
      # Read-only access to the shared logs dir for active_trades.json
      - ./bot/logs:/app/logs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # RL execution sidecar. Receives every accepted/rejected main-bot signal over
  # REST and can trade the setup on a separate Bybit demo account using
  # RL_BYBIT_API_KEY / RL_BYBIT_API_SECRET from bot/.env.
  rl-exec-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python rl_execution_bot.py
    container_name: rl-exec-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      RL_HOST: 0.0.0.0
      RL_PORT: "8090"
      RL_LOG_DIR: /app/rl
      RL_STATE_PATH: /app/rl/runtime_state.json
      RL_MODEL_PATH: /app/rl/agent_state.json
      RL_DECISIONS_PATH: /app/rl/decisions.jsonl
      RL_REWARDS_PATH: /app/rl/rewards.jsonl
      RL_TRAINING_EXAMPLES_PATH: /app/rl/training_examples.jsonl
      RL_ALLOW_REVERSE_ACTIONS: "true"
      RL_RISK_MULTIPLIERS: "million_moves=0.50,wolfe_wave:rejected=0.70,wolfe_wave_v2:rejected=0.70"
      RL_WOLFE_CHECKPOINT_ENABLED: "true"
      RL_WOLFE_CHECKPOINT_CHAT_ID: "-1002342104003"
      RL_WOLFE_CHECKPOINTS: "50,150,200,300"
      # Only count Wolfe closes from the HTF-gate deploy boundary onward, so the
      # 50/150/200/300 checkpoints measure the gated strategy in isolation.
      RL_WOLFE_CHECKPOINT_SINCE: "2026-06-21T05:26:00+00:00"
    volumes:
      - ./bot/logs/rl:/app/rl
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # BTC weekday/Monday/regime edge bot.
  # Listens to Bybit public 1h klines, sends Telegram signals with the
  # historical 1R stats, and can optionally execute on a separate Bybit Demo
  # account via WEEKDAY_EDGE_BYBIT_API_KEY / WEEKDAY_EDGE_BYBIT_API_SECRET.
  weekday-edge-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python weekday_edge_bot.py
    container_name: weekday-edge-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    depends_on:
      - rl-exec-bot
    environment:
      LOG_DIR: /app/logs
      WEEKDAY_EDGE_LOG_DIR: /app/logs
      WEEKDAY_EDGE_LEDGER_PATH: /app/logs/weekday_edge_signals.jsonl
      WEEKDAY_EDGE_STATS_PATH: /app/weekday_1r_eval/btcusdt_20210525_20260525_1r_weekday_entry_hour_meaningful.csv
      WEEKDAY_EDGE_RL_EXECUTION_URL: http://rl-exec-bot:8090/v1/signals
      WEEKDAY_EDGE_RL_EXECUTION_TIMEOUT_SECONDS: "1.0"
    volumes:
      - ./bot/logs:/app/logs
      - ./scripts/output/bybit_regime_histogram/weekday_1r_eval:/app/weekday_1r_eval:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Capitulation Spring strategy sidecar.
  # Listens to Bybit 5m klines for a basket of perps, detects the deep-sweep
  # Wyckoff spring + early-week + negative-funding-flush long setup, forwards
  # accepted signals to the RL sidecar, and (when enabled) executes a scaled
  # 4R/12R/30R exit on a separate Bybit Demo account. Execution OFF by default.
  capitulation-spring-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python capitulation_spring_bot.py
    container_name: capitulation-spring-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    depends_on:
      - rl-exec-bot
    environment:
      LOG_DIR: /app/logs
      CAPITULATION_LOG_DIR: /app/logs
      CAPITULATION_LEDGER_PATH: /app/logs/capitulation_spring_signals.jsonl
      CAPITULATION_RL_EXECUTION_URL: http://rl-exec-bot:8090/v1/signals
      CAPITULATION_RL_EXECUTION_TIMEOUT_SECONDS: "1.0"
      # Execute on DEMO by default (forward test the full fill/exit path). Provide demo
      # keys via CAPITULATION_BYBIT_API_KEY/SECRET in bot/.env; if absent the bot
      # degrades to signal+RL-forward only. Going LIVE requires CAPITULATION_BYBIT_DEMO
      # =false AND CAPITULATION_LIVE_CONFIRM=true (guarded).
      CAPITULATION_TRADING_ENABLED: "true"
      CAPITULATION_BYBIT_DEMO: "true"
    volumes:
      - ./bot/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Matrix signal listener/forwarder.
  # Joins a Matrix room, parses signal messages, and forwards them to the
  # matrix-dedicated RL sidecar for execution and reward handling.
  # Configure MATRIX_HOMESERVER, MATRIX_ACCESS_TOKEN, MATRIX_ROOM_ID in .env.matrix.
  matrix-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python matrix_signal_bot.py
    container_name: matrix-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env.matrix
      - path: ./bot/.env.funded
        required: false
    depends_on:
      - matrix-rl-exec-bot
    environment:
      MATRIX_RL_EXECUTION_URL: http://matrix-rl-exec-bot:8091/v1/signals
      MATRIX_OPI_BRAIN_CANDIDATES: BTCUSDT:5m,XLMUSDT:5m,XAUUSDT:5m
      MATRIX_FUNDED_SYMBOLS: XLMUSDT,ADAUSDT
      MATRIX_FUNDED_STRATEGIES: wolfe_channel
      MATRIX_FUNDED_STATUSES: accepted
      MATRIX_FUNDED_RISK_USDT: "7.5"
      MATRIX_FUNDED_MAX_TOTAL_OPEN_RISK_USDT: "15"
      MATRIX_FUNDED_MAX_OPEN_POSITIONS: "2"
      MATRIX_FUNDED_MAX_SYMBOL_POSITIONS: "1"
      MATRIX_FUNDED_ACCOUNT_EQUITY_FLOOR: "4500"
      MATRIX_FUNDED_ACCOUNT_EQUITY_BUFFER_USDT: "10"
      MATRIX_FUNDED_ACCOUNT_TARGET_EQUITY: "5300"
      MATRIX_RL_EXECUTION_TIMEOUT_SECONDS: "1.0"
      LOG_DIR: /app/logs
    volumes:
      - ./bot/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Matrix-dedicated RL execution sidecar.
  # Uses credentials from bot/.env.matrix and executes matrix-room setups.
  matrix-rl-exec-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python rl_execution_bot.py
    container_name: matrix-rl-exec-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env.matrix
    environment:
      RL_HOST: 0.0.0.0
      RL_PORT: "8091"
      RL_LOG_DIR: /app/rl_matrix
      RL_STATE_PATH: /app/rl_matrix/runtime_state.json
      RL_MODEL_PATH: /app/rl_matrix/agent_state.json
      RL_DECISIONS_PATH: /app/rl_matrix/decisions.jsonl
      RL_REWARDS_PATH: /app/rl_matrix/rewards.jsonl
      RL_TRAINING_EXAMPLES_PATH: /app/rl_matrix/training_examples.jsonl
      RL_ALLOW_REVERSE_ACTIONS: "false"
      RL_RISK_MULTIPLIERS: "bandit_ldz=0.65,opi_brain=0.75,opi_full=0.75,opi_curl_reversal=0.75"
      RL_TRAILING_POLL_SECONDS: "2.0"
    volumes:
      - ./bot/logs/rl_matrix:/app/rl_matrix
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── One-off DT training service ─────────────────────────────────────────────
  # Read-only local dashboard for both RL sidecars.
  rl-dashboard:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python scripts/rl_dashboard.py --host 0.0.0.0 --port 8765 --log-root /app/logs
    container_name: rl-dashboard
    restart: unless-stopped
    environment:
      RL_DASHBOARD_LOG_ROOT: /app/logs
      RL_DASHBOARD_HOST: 0.0.0.0
      RL_DASHBOARD_PORT: "8765"
    ports:
      - "8765:8765"
    volumes:
      - ./bot/logs:/app/logs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Run with: docker compose run --rm mm-train
  # Trains per-coin DT models and writes them to ./bot/models/
  mm-train:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python train_dt.py
    profiles: ["train"]
    env_file:
      - ./bot/.env
    environment:
      CONFIGS_PATH: /app/configs/top20_configs.json
      MODELS_DIR: /app/models
    volumes:
      - ./bot/configs:/app/configs:ro
      - ./bot/models:/app/models:rw

  # ── Bybit liquidity heatmap service ─────────────────────────────────────────
  # Streams order books over WebSocket for the fixed HEATMAP_SYMBOLS universe
  # (set in bot/.env.heatmap), aggregates each book into a price-bin x time
  # heatmap + depth bands, and persists both to a SQLite DB on the shared
  # ./bot/heatmap_data bind mount (survives restarts AND rebuilds). Other bots
  # read it over the compose network, e.g.
  #   http://heatmap-bot:8110/v1/heatmap/BTCUSDT/latest
  # Public market data only — no API keys needed.
  heatmap-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python heatmap_bot.py
    container_name: heatmap-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env.heatmap
    environment:
      # NOTE: HEATMAP_SYMBOLS is intentionally NOT set here so the fixed universe
      # comes from bot/.env.heatmap (compose `environment` would override env_file).
      HEATMAP_API_HOST: 0.0.0.0
      HEATMAP_API_PORT: "8110"
      HEATMAP_DB_PATH: /app/data/heatmap.db
      HEATMAP_CONFIG_PATH: /app/configs/heatmap_configs.json
      HEATMAP_DEPTH: "50"
      HEATMAP_SNAPSHOT_INTERVAL_SECONDS: "10"
      HEATMAP_RETENTION_HOURS: "168"
      LOG_DIR: /app/logs
    ports:
      - "8110:8110"
    volumes:
      - ./bot/configs:/app/configs:ro
      # Named volume (lives on the Docker VM's fast ext4 fs, not the slow host bind
      # mount) — persists across rebuilds & restarts; removed only by `down -v`.
      - heatmap_data:/app/data
      - ./bot/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Heatmap Telegram bot ────────────────────────────────────────────────────
  # Long-polls Telegram. When a WHITELISTED user id asks for a universe coin
  # (e.g. "/heatmap BTCUSDT" or just "BTC"), it fetches that coin's 2D grid from
  # heatmap-bot's REST API, renders it to a PNG, and replies with the image.
  # Talks only to Telegram + heatmap-bot (no Bybit / no exchange access).
  heatmap-telegram-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python heatmap_telegram_bot.py
    container_name: heatmap-telegram-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env.heatmap
    environment:
      HEATMAP_API_URL: http://heatmap-bot:8110
      LOG_DIR: /app/logs
    depends_on:
      - heatmap-bot
    volumes:
      - ./bot/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  relay-bot:
    build:
      context: ./relay
      dockerfile: Dockerfile
    container_name: relay-bot
    restart: unless-stopped
    env_file:
      - ./relay/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Wolfe DCA bot (STANDALONE — separate Bybit Demo account) ────────────────
  # Self-contained runner (bot/wolfe_dca_bot.py): reuses the shared Wolfe detection,
  # executes + POLL-monitors the DCA second-leg structure entirely on its own. It
  # never touches the production mm-bot's positions/state. Own demo account
  # (bot/.env.dca), own ledger (bot/logs_dca/wolfe_dca_ledger.jsonl).
  # Start with:  docker compose up -d --build wolfe-dca-bot
  wolfe-dca-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python wolfe_dca_bot.py
    container_name: wolfe-dca-bot
    restart: unless-stopped
    profiles: ["dca"]         # not started by a plain `up`; use `up -d wolfe-dca-bot`
    env_file:
      - ./bot/.env.dca        # SEPARATE demo account keys + settings (see .env.dca.example)
    environment:
      LOG_DIR: /app/logs
      WOLFE_DCA_CONFIG_PATH: /app/configs/wolfe_wave_shared_v1_dca_configs.json
      WOLFE_DCA_LEDGER_PATH: /app/logs/wolfe_dca_ledger.jsonl
    volumes:
      - ./bot/configs:/app/configs:ro
      - ./bot/logs_dca:/app/logs        # ISOLATED ledger/state (separate from mm-bot)
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Heatmap forward-test executor (STANDALONE — separate Bybit Demo account) ──
  # Polls heatmap-bot /v1/setup for the universe and paper-trades valid setups (risk-sized
  # market entry + native SL/TP bracket) on its OWN demo account (bot/.env.heatmap_demo).
  # Records every trade to logs/heatmap_forward_ledger.jsonl for out-of-sample stats.
  # Start with:  docker compose up -d --build heatmap-forward-bot
  heatmap-forward-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python heatmap_forward_bot.py
    container_name: heatmap-forward-bot
    restart: unless-stopped
    profiles: ["forward"]          # opt-in; not started by a plain `up`
    env_file:
      - ./bot/.env.heatmap_demo    # SEPARATE demo account keys + risk settings
    environment:
      HEATMAP_API_URL: http://heatmap-bot:8110
      LOG_DIR: /app/logs
    depends_on:
      - heatmap-bot
    volumes:
      - ./bot/logs:/app/logs       # shared: ledger readable by heatmap-telegram-bot (/forward)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volumes — persist across container rebuilds/restarts; survive `down`,
# removed only by `docker compose down -v`.
volumes:
  heatmap_data:    # heatmap-bot SQLite DB (fast Docker-VM fs; shared via the REST API)
