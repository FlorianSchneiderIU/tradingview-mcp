services:
  mm-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: mm-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      # ── API credentials ─────────────────────────────────────────────────────

      # ── Trading mode ────────────────────────────────────────────────────────
      # true  → Bybit Demo Trading (api-demo.bybit.com, simulated funds)
      # false → Live trading (api.bybit.com, real funds!)

      # ── Risk / position sizing ───────────────────────────────────────────────
      # Target account loss at the initial stop-loss as a fraction of equity (0.01 = 1%)

      # Maximum number of simultaneously open positions across all coins

      # Leverage caps are fetched per symbol; order leverage is set dynamically
      # before entry so Bybit risk-tier position caps are not squeezed by max leverage.

      # Daily drawdown limit: block new entries once net equity loss for the UTC day
      # exceeds this fraction of the day-start equity. Tracked positions are flattened
      # by default and entries resume at the next UTC day.
      # Optional weekly account drawdown limit. 0 disables it.

      # Correlation cluster guard: max simultaneous positions from the 18-coin correlated
      # cluster (every coin except TRXUSDT, which is the portfolio's only independent coin).
      # Research (16 months, 19 coins) found 149/171 pairs at return corr >= 0.60 — all 18
      # form one cluster. Default 3 keeps two slots free while total stays at 5.

      # ── Internal paths (no need to change when using volumes below) ──────────
      CONFIGS_PATH: /app/configs/top20_configs.json
      MODELS_DIR: /app/models
      RISK_STATE_PATH: /app/logs/risk_state.json
      ACTIVE_TRADES_STATE_PATH: /app/logs/active_trades.json
      TRADE_LEDGER_PATH: /app/logs/trade_ledger.jsonl
      HEARTBEAT_STATE_PATH: /app/logs/heartbeat_state.json
      RL_EXECUTION_URL: http://rl-exec-bot:8090/v1/signals
      RL_EXECUTION_TIMEOUT_SECONDS: "1.0"
      TURTLE_MODELS_DIR: /app/turtle_models
      TURTLE_LEADERBOARD_PATH: /app/turtle_leaderboard.csv
      SESSION_ORB_MODELS_DIR: /app/session_orb_models
      LOG_DIR: /app/logs
    depends_on:
      - rl-exec-bot

    volumes:
      # Coin configs (read-only) — edit top20_configs.json to adjust the coin list
      - ./bot/configs:/app/configs:ro
      # Pre-trained DT models (read-only) — generated by mm-train or train_dt.py
      - ./bot/models:/app/models:ro
      - ./scripts/bybit_top50_turtle_per_symbol_turnover_sfp_tex_v4_models:/app/turtle_models:ro
      - ./scripts/bybit_top50_turtle_per_symbol_turnover_sfp_tex_v4_leaderboard.csv:/app/turtle_leaderboard.csv:ro
      - ./scripts/session_orb_top50_judas_fvg_risk2_v1_models:/app/session_orb_models:ro
      # Persisted logs ─ survives container restarts
      - ./bot/logs:/app/logs

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Standalone fill notification service ─────────────────────────────────────
  # Dedicated container that connects to the private Bybit WS and sends
  # Telegram TP/SL fill messages.  Reads active_trades.json (written by
  # mm-bot) from the shared logs volume to enrich messages with strategy/
  # direction context.  Set FILL_NOTIFY_EXTERNAL=true in .env so the main
  # bot keeps its private WS for position management but skips duplicate
  # Telegram sends.
  fill-notifier:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python fill_notifier.py
    container_name: fill-notifier
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      ACTIVE_TRADES_STATE_PATH: /app/logs/active_trades.json
      LOG_DIR: /app/logs
    volumes:
      # Read-only access to the shared logs dir for active_trades.json
      - ./bot/logs:/app/logs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # RL execution sidecar. Receives every accepted/rejected main-bot signal over
  # REST and can trade the setup on a separate Bybit demo account using
  # RL_BYBIT_API_KEY / RL_BYBIT_API_SECRET from bot/.env.
  rl-exec-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python rl_execution_bot.py
    container_name: rl-exec-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    environment:
      RL_HOST: 0.0.0.0
      RL_PORT: "8090"
      RL_LOG_DIR: /app/rl
      RL_STATE_PATH: /app/rl/runtime_state.json
      RL_MODEL_PATH: /app/rl/agent_state.json
      RL_DECISIONS_PATH: /app/rl/decisions.jsonl
      RL_REWARDS_PATH: /app/rl/rewards.jsonl
      RL_TRAINING_EXAMPLES_PATH: /app/rl/training_examples.jsonl
    volumes:
      - ./bot/logs/rl:/app/rl
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # BTC weekday/Monday/regime edge bot.
  # Listens to Bybit public 1h klines, sends Telegram signals with the
  # historical 1R stats, and can optionally execute on a separate Bybit Demo
  # account via WEEKDAY_EDGE_BYBIT_API_KEY / WEEKDAY_EDGE_BYBIT_API_SECRET.
  weekday-edge-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python weekday_edge_bot.py
    container_name: weekday-edge-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    depends_on:
      - rl-exec-bot
    environment:
      LOG_DIR: /app/logs
      WEEKDAY_EDGE_LOG_DIR: /app/logs
      WEEKDAY_EDGE_LEDGER_PATH: /app/logs/weekday_edge_signals.jsonl
      WEEKDAY_EDGE_STATS_PATH: /app/weekday_1r_eval/btcusdt_20210525_20260525_1r_weekday_entry_hour_meaningful.csv
      WEEKDAY_EDGE_RL_EXECUTION_URL: http://rl-exec-bot:8090/v1/signals
      WEEKDAY_EDGE_RL_EXECUTION_TIMEOUT_SECONDS: "1.0"
    volumes:
      - ./bot/logs:/app/logs
      - ./scripts/output/bybit_regime_histogram/weekday_1r_eval:/app/weekday_1r_eval:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Matrix signal follower.
  # Joins a Matrix room, parses signal messages, and places Bybit orders.
  # Configure MATRIX_HOMESERVER, MATRIX_ACCESS_TOKEN, MATRIX_ROOM_ID in .env.
  matrix-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python matrix_signal_bot.py
    container_name: matrix-bot
    restart: unless-stopped
    env_file:
      - ./bot/.env.matrix
    environment:
      ACTIVE_TRADES_STATE_PATH: /app/logs/active_trades.json
      LOG_DIR: /app/logs
    volumes:
      - ./bot/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── One-off DT training service ─────────────────────────────────────────────
  # Run with: docker compose run --rm mm-train
  # Trains per-coin DT models and writes them to ./bot/models/
  mm-train:
    build:
      context: .
      dockerfile: bot/Dockerfile
    command: python train_dt.py
    profiles: ["train"]
    env_file:
      - ./bot/.env
    environment:
      CONFIGS_PATH: /app/configs/top20_configs.json
      MODELS_DIR: /app/models
    volumes:
      - ./bot/configs:/app/configs:ro
      - ./bot/models:/app/models:rw
